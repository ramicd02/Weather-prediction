# Weatherbot configuration. Secrets never go here: they come from environment
# variables (KALSHI_ENV, KALSHI_API_KEY_ID, KALSHI_PRIVATE_KEY_PATH).
#
# Personal settings (your NWS contact email, any local overrides) go in
# config.local.yaml next to this file. Git ignores it, and any key in it overrides
# the same key here, so `git pull` never clashes with your edits.

logger:
  db_path: data_store/weatherbot.db

  # Which Kalshi series to log. Every series whose ticker starts with this prefix
  # is tracked (all KXHIGH cities, so cities can be ranked later).
  series_prefix: KXHIGH

  discovery_interval_s: 900        # re-scan for new markets every 15 minutes
  snapshot_interval_s: 60          # save changed books at least once a minute
  settlement_poll_interval_s: 1800 # check closed markets for results every 30 min
  obs_interval_s: 600              # NWS latest observation every 10 minutes
  cli_interval_s: 10800            # CLI reports every 3 hours (catches prelim + final)

  # Client-side cap on Kalshi REST reads (Basic tier allows 20/s; stay well under).
  kalshi_reads_per_s: 8

  # The logger is read-only. If the API key has write scope, refuse to start
  # unless this is set to true. Strongly recommended: keep false and use a
  # read-only key.
  allow_write_scoped_key: false

nws:
  # NWS asks every client to identify itself with an app name and contact.
  # Set your own in config.local.yaml:
  #   nws:
  #     user_agent: "weatherbot-logger (contact: you@example.com)"
  user_agent: "weatherbot-logger (contact: REPLACE_WITH_YOUR_EMAIL)"

# Settlement station (ICAO) per series, confirmed against each market's rules text
# on 2026-11-04. Overrides the automatic match from the rules.
stations:
  KXHIGHAUS: KAUS
  KXHIGHCHI: KMDW
  KXHIGHDEN: KDEN
  KXHIGHLAX: KLAX
  KXHIGHMIA: KMIA
  KXHIGHNY: KNYC
  KXHIGHPHIL: KPHL
  KXHIGHTATL: KATL
  KXHIGHTBOS: KBOS
  KXHIGHTDAL: KDFW
  KXHIGHTDC: KDCA
  KXHIGHTEWR: KEWR
  KXHIGHTHOU: KHOU
  KXHIGHTLV: KLAS
  KXHIGHTMIN: KMSP
  KXHIGHTNOLA: KMSY
  KXHIGHTOKC: KOKC
  KXHIGHTPHX: KPHX
  KXHIGHTSAN: KSAN
  KXHIGHTSATX: KSAT
  KXHIGHTSDF: KSDF
  KXHIGHTSEA: KSEA
  KXHIGHTSFO: KSFO
  KXHIGHTTN: KTTN

# Optional: NWS CLI location code per station, when it isn't the ICAO id
# without its leading K (e.g. KMDW -> MDW).
cli_codes: {}

# --- Phase 2: model, backtest and risk (approved 2026-11-04) -----------------------
# Every sizing, cap and stop lives here (CLAUDE.md rule 7). Percentages are fractions
# of bankroll (0.02 = 2%). Probabilities and edges are fractions (0.05 = 5 points).

# Series never traded (still logged). Miami: settlement mismatches, see CLAUDE.md rule 6.
trading_exclude_series:
  - KXHIGHMIA

model:
  settlement_noise: 0.001          # chance the settled high is 1F off the NWS high
  version_handover_days: 120       # v5.0 fully replaces the old NBM fit after this many days
  winter_spread_factor: 1.15       # extra widening Dec-Feb until v5.0 has a winter of data
  winter_months: [12, 1, 2]
  min_winter_days: 60              # v5.0 winter days needed before the widening stops
  season_bandwidth_days: 45        # training days weighted by closeness in time of year
  recency_days: 365                # ...and by recency (weight e^-age/365)
  shrink_days: 30                  # thin cities pulled toward the all-city fit
  min_train_days: 60               # don't score a city-month with less history

backtest:
  bankroll_usd: 1000               # notional; no real money
  decision_hour_utc: 16            # one decision a day, the day before the market's date
  quote_max_age_hours: 3           # older quotes count as no quote
  price_stress_cents: 1            # every result is rerun with fills this much worse
  tuning_end: "2026-07-31"         # tune only on days up to here
  locked_months: ["2026-08", "2026-09", "2026-10"]   # final test, run once

risk:
  min_edge: 0.05                   # blended probability beats price + fee by 5 points...
  min_edge_relative: 0.25          # ...and by 25% of the price
  kelly_fraction: 0.25             # quarter-Kelly
  max_contracts_per_trade: 50
  cap_city_day: 0.02               # max cost at risk per city-day
  cap_region_day: 0.04             # max cost at risk per region per day
  cap_day: 0.10                    # max cost at risk per day, all cities
  daily_stop: -0.05                # stop trading for the day after this loss
  drawdown_halt: -0.15             # halt after this drop from peak

# Cities whose weather moves together share a cap.
regions:
  northeast: [KXHIGHNY, KXHIGHTEWR, KXHIGHTTN, KXHIGHPHIL, KXHIGHTBOS, KXHIGHTDC]
  texas: [KXHIGHAUS, KXHIGHTDAL, KXHIGHTHOU, KXHIGHTSATX]
  southeast: [KXHIGHTATL, KXHIGHTNOLA, KXHIGHMIA]
  midwest: [KXHIGHCHI, KXHIGHTMIN, KXHIGHTSDF, KXHIGHTOKC]
  mountain_desert: [KXHIGHDEN, KXHIGHTLV, KXHIGHTPHX]
  west_coast: [KXHIGHLAX, KXHIGHTSAN, KXHIGHTSFO, KXHIGHTSEA]
