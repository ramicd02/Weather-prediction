[project]
name = "weatherbot"
version = "0.1.0"
description = "Kalshi daily-high temperature market data logger and (later) trading bot"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "cryptography>=42",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["weatherbot*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
